const months = ['전체', ...new Set(games.map(g=>g.date.slice(5,7)+'월'))];
let current = '전체';
const filters = document.getElementById('filters'), list = document.getElementById('list'), search = document.getElementById('search');
function drawFilters(){filters.innerHTML = months.map(m=>'<button class="'+(m===current?'on':'')+'" data-m="'+m+'">'+m+'</button>').join('');}
function esc(v){return String(v ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}
function card(g){
  const rcls = g.result==='승'?'win':g.result==='패'?'lose':g.result==='무'?'draw':'';
  const extra = (g.tv && g.tv !== '-' ? ' · '+g.tv : '') + (g.note && g.note !== '-' ? ' · '+g.note : '');
  return '<article class="game"><div><div class="date">'+esc(g.dateLabel)+'</div><div class="time">'+esc(g.time||'시간 미정')+'</div></div><div><span class="badge '+(g.home?'home':'away')+'">'+(g.home?'HOME':'AWAY')+' · '+esc(g.venue)+'</span><div class="main">두산 vs '+esc(g.opponent||'상대 미정')+'</div><div class="sub">'+esc(g.matchup+extra)+'</div></div><div class="result '+rcls+'">'+esc(g.result||'예정')+'</div></article>';
}
function render(){const q=search.value.trim();const rows=games.filter(g=>(current==='전체'||g.date.slice(5,7)+'월'===current)&&(!q||[g.opponent,g.venue,g.matchup,g.tv].join(' ').includes(q)));list.innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">조건에 맞는 경기가 없어 😶</div>';}
filters.onclick=e=>{if(e.target.tagName==='BUTTON'){current=e.target.dataset.m;drawFilters();render();}};search.oninput=render;drawFilters();render();
</script>
